name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LIB_CSPROJ: TomasTech Plc Keyence.csproj
  TEST_CSPROJ: tests/TomasTech Plc Keyence.Tests/TomasTech Plc Keyence.Tests.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore "$LIB_CSPROJ"
          dotnet restore "$TEST_CSPROJ"

      - name: Build library (all target frameworks, warnings as errors)
        run: dotnet build "$LIB_CSPROJ" -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test "$TEST_CSPROJ" -c Release --no-restore

      - name: Pack
        run: dotnet pack "$LIB_CSPROJ" -c Release --no-build -o ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.*nupkg
